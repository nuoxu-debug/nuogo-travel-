name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require a production API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { isIP } from 'node:net';
          const value = process.env.VITE_API_URL;
          const fail = () => {
            console.error('::error::Set repository variable VITE_API_URL to your public HTTPS backend URL ending in /api (Settings > Secrets and variables > Actions > Variables). GitHub Pages cannot serve the API.');
            process.exit(1);
          };
          let url;
          try { url = new URL(value); } catch { fail(); }
          const publicHost = /^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i.test(url.hostname)
            && !isIP(url.hostname)
            && !/(^|\.)(localhost|local|internal|test|invalid|example|example\.com|example\.org|example\.net)$/i.test(url.hostname);
          if (value !== value.trim() || url.protocol !== 'https:' || !publicHost
            || !/^\/api\/?$/.test(url.pathname) || url.username || url.password
            || url.search || url.hash || (url.port && url.port !== '443')) fail();
          NODE

  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [configuration, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build client
        run: npm --workspace client run build
        env:
          VITE_BASE_PATH: /nuogo-travel-/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Add SPA fallback
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
